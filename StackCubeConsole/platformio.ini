[platformio]
extra_configs = ../platformio-common.ini
src_dir = .

[env:cores3]
build_src_filter = +<integration/> +<drivers/> +<ui/>
lib_ignore = StackCubeConsole
extra_scripts =
    ${env.extra_scripts}
    pre:configure_elf_loader.py
    post:configure_upload.py
build_flags =
    -std=gnu++17
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    ${env.lib_deps}
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@7.4.2
